    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      color: #e0e0e0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-style: italic;
      margin-bottom: 3rem;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }

    .civilizations {
      display: grid;
      gap: 3rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .civilization {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      background: #111118;
    }

    .civ-header {
      padding: 1.5rem 2rem;
      display: flex;
      align-items: baseline;
      gap: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .civ-emoji { font-size: 2rem; line-height: 1; }

    .civ-title-block { flex: 1; }

    .civ-title {
      font-size: 1.3rem;
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    .civ-logic {
      font-size: 0.75rem;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 0.25rem;
      opacity: 0.75;
    }

    .entries {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }

    .entry {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      border-right: 1px solid rgba(255,255,255,0.05);
      transition: background 0.2s;
    }

    .entry:hover { background: rgba(255,255,255,0.03); }

    .entry-top {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }

    .prime-badge {
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 0.15em 0.45em;
      border-radius: 4px;
      letter-spacing: 0.08em;
      opacity: 0.85;
      flex-shrink: 0;
    }

    .entry-name {
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.03em;
    }

    .entry-description {
      font-size: 0.82rem;
      color: #aaa;
      line-height: 1.55;
      font-style: italic;
    }

    .logic-red .civ-header { background: linear-gradient(135deg, #1a0808, #2a0f0f); border-bottom-color: rgba(220,50,50,0.25); }
    .logic-red .civ-title { color: #ff6b6b; }
    .logic-red .civ-logic { color: #ff6b6b; }
    .logic-red .prime-badge { background: rgba(220,50,50,0.2); color: #ff6b6b; border: 1px solid rgba(220,50,50,0.35); }

    .logic-diamond .prime-badge { background: rgba(160,220,255,0.12); color: #b8eeff; border: 1px solid rgba(160,220,255,0.3); }

    @media (max-width: 600px) {
      .entries { grid-template-columns: 1fr; }
      .civ-header { padding: 1.25rem 1.25rem; }
    }
  </style>

  "Obsidian Logic": "logic-obsidian"
};

const container = document.getElementById("civilizations");

for (const civ of data.civilizations) {
  const logicClass = logicClassMap[civ.logic] || "";

  const civEl = document.createElement("div");
  civEl.className = `civilization ${logicClass}`;

  const header = document.createElement("div");
  header.className = "civ-header";
  header.innerHTML = `
    <span class="civ-emoji">${civ.emoji}</span>
    <div class="civ-title-block">
      <div class="civ-title">${civ.title}</div>
      <div class="civ-logic">${civ.logic} · ${civ.region}</div>
    </div>
  `;

  const entries = document.createElement("div");
  entries.className = "entries";

  for (const entry of civ.entries) {
    const entryEl = document.createElement("div");
    entryEl.className = "entry";
    entryEl.innerHTML = `
      <div class="entry-top">
        <span class="prime-badge">#${entry.primeIndex} · p${entry.primeNode}</span>
        <span class="entry-name">${entry.name}</span>
      </div>
      <div class="entry-description">${entry.description}</div>
    `;
    entries.appendChild(entryEl);
  }

  civEl.appendChild(header);
  civEl.appendChild(entries);
  container.appendChild(civEl);
}
</script>
</body>
</html>
